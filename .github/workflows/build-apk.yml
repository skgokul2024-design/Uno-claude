name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      - name: Stash project sources
        run: |
          mkdir -p /tmp/stash
          cp -r lib /tmp/stash/lib
          cp -r test /tmp/stash/test
          cp pubspec.yaml /tmp/stash/pubspec.yaml

      - name: Generate Android scaffolding
        run: flutter create --platforms=android --org com.unonearby --project-name uno_nearby .

      - name: Restore project sources
        run: |
          rm -rf lib test pubspec.yaml
          cp -r /tmp/stash/lib lib
          cp -r /tmp/stash/test test
          cp /tmp/stash/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart

      - name: Inject Android permissions
        run: python3 tool/add_permissions.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-nearby-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
